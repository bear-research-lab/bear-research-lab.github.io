<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="440" height="300" rx="16" fill="#f4f8fc"/>
  <text x="220" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#243b53">Under-actuated Tendon Transmission</text>
  <!-- single actuator -->
  <rect x="30" y="125" width="70" height="50" rx="8" fill="#007ACC"/>
  <text x="65" y="155" text-anchor="middle" font-size="12" fill="#ffffff">1 motor</text>
  <circle cx="110" cy="150" r="10" fill="#ffffff" stroke="#007ACC" stroke-width="3"/>
  <!-- tendons splitting to joints -->
  <g fill="none" stroke="#e07a1f" stroke-width="2.5" stroke-linecap="round">
    <path d="M120,150 C170,150 180,95 230,95 L390,95"/>
    <path d="M120,150 L390,150"/>
    <path d="M120,150 C170,150 180,205 230,205 L390,205"/>
  </g>
  <!-- joints on each tendon -->
  <g fill="#ffffff" stroke="#243b53" stroke-width="2">
    <circle cx="260" cy="95" r="8"/><circle cx="320" cy="95" r="8"/><circle cx="380" cy="95" r="8"/>
    <circle cx="260" cy="150" r="8"/><circle cx="320" cy="150" r="8"/><circle cx="380" cy="150" r="8"/>
    <circle cx="260" cy="205" r="8"/><circle cx="320" cy="205" r="8"/><circle cx="380" cy="205" r="8"/>
  </g>
  <text x="65" y="200" text-anchor="middle" font-size="11" fill="#5b6b7b">few actuators</text>
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#5b6b7b">many joints</text>
  <text x="220" y="275" text-anchor="middle" font-size="12" fill="#243b53">routing determines the motion</text>
</svg>
